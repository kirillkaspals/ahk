<!DOCTYPE html>
<html>
<head>
    <title>Панель администратора AHK</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #444; padding: 10px; text-align: left; }
        th { background: #333; }
        input, button { padding: 8px; margin: 5px 0; }
    </style>
</head>
<body>
    <h2>Панель управления подписками</h2>
    
    <h3>Добавить / Активировать HWID</h3>
    <form action="/admin/add" method="post">
        <input type="hidden" name="key" value="{{ key }}">
        <input type="text" name="hwid" placeholder="HWID пользователя" required size="40">
        <input type="text" name="note" placeholder="Заметка (Ник / Discord)">
        <button type="submit">Сохранить</button>
    </form>

    <h3>Список пользователей</h3>
    <table>
        <tr>
            <th>HWID</th>
            <th>Заметка</th>
            <th>Статус</th>
        </tr>
        {% for user in users %}
        <tr>
            <td>{{ user[0] }}</td>
            <td>{{ user[1] }}</td>
            <td>{% if user[2] == 1 %}АКТИВЕН{% else %}ЗАБЛОКИРОВАН{% endif %}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
