<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель управления AHK</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #181818; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #242424; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        h2, h3 { color: #ffffff; border-bottom: 2px solid #333; padding-bottom: 10px; }
        form { margin-bottom: 20px; }
        input[type="text"] { background: #333; border: 1px solid #444; color: #fff; padding: 10px; margin-right: 10px; border-radius: 4px; }
        button { background: #4CAF50; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #45a049; }
        button.btn-toggle { background: #ff9800; }
        button.btn-delete { background: #f44336; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #333; padding: 12px; text-align: left; }
        th { background-color: #2e2e2e; }
        tr:nth-child(even) { background-color: #1e1e1e; }
        .status-active { color: #4CAF50; font-weight: bold; }
        .status-blocked { color: #f44336; font-weight: bold; }
        .actions { display: flex; gap: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Панель управления подписками AHK</h2>
        
        <h3>Активировать / Добавить HWID</h3>
        <form action="/admin/add" method="post">
            <input type="hidden" name="key" value="{{ key }}">
            <input type="text" name="hwid" placeholder="HWID (например, M80-G6003600251)" required size="35">
            <input type="text" name="note" placeholder="Заметка (Ник / Discord)" size="25">
            <button type="submit">Сохранить</button>
        </form>

        <h3>Список пользователей</h3>
        <table>
            <thead>
                <tr>
                    <th>HWID</th>
                    <th>Заметка</th>
                    <th>Статус</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td><code>{{ user[0] }}</code></td>
                    <td>{{ user[1] }}</td>
                    <td>
                        {% if user[2] == 1 %}
                            <span class="status-active">АКТИВЕН</span>
                        {% else %}
                            <span class="status-blocked">ЗАБЛОКИРОВАН</span>
                        {% endif %}
                    </td>
                    <td class="actions">
                        <form action="/admin/toggle" method="post" style="display:inline;">
                            <input type="hidden" name="key" value="{{ key }}">
                            <input type="hidden" name="hwid" value="{{ user[0] }}">
                            <button type="submit" class="btn-toggle">
                                {% if user[2] == 1 %}Заблокировать{% else %}Разблокировать{% endif %}
                            </button>
                        </form>
                        <form action="/admin/delete" method="post" style="display:inline;">
                            <input type="hidden" name="key" value="{{ key }}">
                            <input type="hidden" name="hwid" value="{{ user[0] }}">
                            <button type="submit" class="btn-delete" onclick="return confirm('Удалить пользователя?')">Удалить</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" style="text-align: center; color: #888;">Нет зарегистрированных HWID</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
